<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pin Pon · PlayPop</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;700;800&family=Shrikhand&family=DM+Serif+Display&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/juegos.css">
</head>
<body class="tema-pong">
<header class="topbar"><a class="back" href="../index.html">← Volver al mazo</a><span class="tag">Carta 4 · Pin Pon</span></header>
<main class="game-wrap">
  <section class="stage"><h1>Pin Pon</h1><p>Gana quien llegue a 5 puntos. W/S vs ↑/↓ en 2 jugadores.</p>
    <div class="mode-row"><button class="btn" id="m1">1 jugador</button><button class="btn ghost" id="m2">2 jugadores</button></div>
    <canvas id="game" width="600" height="400"></canvas></section>
  <aside class="panel"><h2>Marcador</h2>
    <div class="score-row"><div class="score"><small>JUG 1</small><span id="s1">0</span></div>
    <div class="score"><small>JUG 2 / CPU</small><span id="s2">0</span></div></div>
    <button class="btn" id="btnStart">Sacar / Reiniciar</button><button class="btn ghost" id="btnPause">Pausa</button>
    <p class="hint" id="msg">Mueve el mouse sobre el canvas también controla la paleta 1.</p></aside>
</main>
<script src="../js/fiesta.js"></script>
<script src="../js/pong.js"></script>
</body></html>
